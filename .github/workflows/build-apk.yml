name: Build ZXCoin APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q ZXCoin_Android_WebView_Project.zip -d extracted

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set ZX COIN launcher icon
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          cp "$GITHUB_WORKSPACE/file_00000000e9f08210b7e1975169f155a5.png" \
            "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.png"

          sed -i 's#android:icon="@[^"]*"#android:icon="@drawable/ic_launcher"#' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@drawable/ic_launcher"#' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          APK_SOURCE=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -1)

          if [ -z "$APK_SOURCE" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          cp "$APK_SOURCE" "$GITHUB_WORKSPACE/ZXCoin.apk"

          echo "APK ready:"
          ls -lh "$GITHUB_WORKSPACE/ZXCoin.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZXCoin-debug-APK
          path: ZXCoin.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zxcoin-latest"

          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/ZXCoin.apk" \
            --title "ZX COIN Latest APK" \
            --notes "Latest ZX COIN Android APK"
