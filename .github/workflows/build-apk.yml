name: Build ZXCoin APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q ZXCoin_Android_WebView_Project.zip -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set ZX COIN launcher icon
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"

          cp "$GITHUB_WORKSPACE/file_00000000e9f08210b7e1975169f155a5.png" \
             "$PROJECT_DIR/app/src/main/res/drawable/ic_launcher.png"

          python3 - "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          text = manifest.read_text()

          text = re.sub(r'\sandroid:icon="[^"]*"', '', text)
          text = re.sub(r'\sandroid:roundIcon="[^"]*"', '', text)

          text = text.replace(
              '<application',
              '<application android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher"',
              1
          )

          manifest.write_text(text)
          print("ZX COIN launcher icon applied.")
          PY

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p release
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             release/ZXCoin.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zxcoin-latest
          name: ZX COIN Latest APK
          body: |
            ZX COIN latest Android APK.
          files: release/ZXCoin.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
